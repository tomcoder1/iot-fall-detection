[project]
name = "iot-fall-detection"
version = "0.1.0"
description = "Cross-platform pose-based fall detection for Windows and Raspberry Pi 4 + Coral"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "tensorflow>=2.21.0",
    "tensorflow>=2.21.0; sys_platform == 'win32'",
    "uvicorn>=0.49.0",
]
